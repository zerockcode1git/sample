spring:
  application:
    name: sample
  profiles:
    active: local
  servlet:
    multipart:
      # 이미지 1개 3MB(버킷 file_size_limit과 동일), 요청 전체 10MB (이미지 3개 + 상품 정보)
      max-file-size: 3MB
      max-request-size: 10MB

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    # 펼친 상태로 보여주고, 요청 소요 시간 표시
    doc-expansion: list
    display-request-duration: true
